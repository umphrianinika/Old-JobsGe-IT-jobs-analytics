name: daily-scrape
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scraper.py --pages 10
      - run: |
          git config user.name "scraper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.db
          git diff --staged --quiet || (git commit -m "daily data update" && git push)
